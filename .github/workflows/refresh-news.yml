name: Refresh data (News, Research Papers, Knowledge Base)

on:
  schedule:
    # 07:00 UTC daily (~midnight PT). Change the cron below to shift the time.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser pandas

      - name: Fetch News, Research Papers, and Knowledge Base
        run: python scripts/fetch_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/news.csv data/research_papers.csv data/knowledge_base.csv; then
            git add data/news.csv data/research_papers.csv data/knowledge_base.csv
            git commit -m "Auto-refresh News/Research/Knowledge Base $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes in data files, skipping commit."
          fi
